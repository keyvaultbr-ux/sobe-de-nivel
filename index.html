<title>KeyVault</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: preto absoluto, tipografia grande, azul elétrico só em ação e estado. Site público em colunas de 1320px; admin em app de tela cheia. */
:root{--bg:#06070a;--bg2:#0b0d12;--pn:#10131a;--pn2:#171b25;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.17);--fg:#f3f5fa;--mt:#8d95a9;--bl:#2c5bff;--bl2:#6c8fff;--bl3:rgba(44,91,255,.15);--ok:#33d19a;--wr:#f1b43f;--er:#ff5b6b;--fd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--fb:'Manrope','Segoe UI',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,Menlo,monospace;--r:6px;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--fb);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
body.loading{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4{font-family:var(--fd);font-weight:700;line-height:1.08;margin:0;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
img,svg{max-width:100%}
:focus-visible{outline:2px solid var(--bl2);outline-offset:2px}
::selection{background:var(--bl);color:#fff}
.wrap{max-width:1320px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--fm)}
.mt{color:var(--mt)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* logo */
.logo{display:block;position:relative;flex:none;width:3.8em;aspect-ratio:1080/808;overflow:hidden;line-height:0;-webkit-mask-image:linear-gradient(to right,transparent,#000 4.5%,#000 95.5%,transparent),linear-gradient(to bottom,transparent,#000 5%,#000 95%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 4.5%,#000 95.5%,transparent),linear-gradient(to bottom,transparent,#000 5%,#000 95%,transparent);mask-composite:intersect}
.logo img{position:absolute;display:block;width:116.11%;height:auto;max-width:none;left:-7.96%;top:-29.46%;user-select:none;-webkit-user-drag:none}
#flyLayer .logo{position:fixed;z-index:101;will-change:transform}
.logo-slot{display:inline-flex;font-size:20px;align-items:center}

/* loader */
#loader{position:fixed;inset:0;background:#020516;z-index:100}
.ld-dots{position:fixed;left:50%;top:calc(50% + 40px);transform:translateX(-50%);display:flex;gap:11px;z-index:101;transition:opacity .4s}
.ld-dots i{display:block;width:9px;height:9px;border-radius:50%;animation:kvb 1.6s cubic-bezier(.45,0,.35,1) infinite}
@keyframes kvb{0%{transform:translateY(0)}13%{transform:translateY(-15px)}27%{transform:translateY(0)}34%{transform:translateY(-3px)}42%,100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.ld-dots i{animation:none}html{scroll-behavior:auto}}
.site{opacity:0}
.site.on{opacity:1}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(6,7,10,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.hdr-in{display:flex;align-items:center;gap:24px;height:64px}
#nav{display:flex;gap:4px;margin-left:8px}
#nav a{padding:8px 12px;font-size:14px;font-weight:600;color:var(--mt);border-radius:var(--r);transition:color .2s,background .2s}
#nav a:hover{color:var(--fg)}
#nav a.on{color:var(--fg);background:var(--pn2)}
#hdr-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.search{position:relative;width:260px}
.search input{width:100%;height:38px;background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);color:var(--fg);padding:0 12px 0 36px;font:inherit;font-size:14px}
.search input:focus{outline:0;border-color:var(--bl)}
.search>svg{position:absolute;left:11px;top:11px;color:var(--mt)}
#sugg{position:absolute;top:44px;left:0;right:0;min-width:340px;background:var(--pn);border:1px solid var(--ln2);border-radius:var(--r);padding:6px;box-shadow:0 24px 60px rgba(0,0,0,.6);z-index:70}
#sugg a,#sugg .sg-all{display:flex;gap:12px;align-items:center;padding:8px;border-radius:4px;font-size:14px}
#sugg a:hover,#sugg .sg-all:hover{background:var(--pn2)}
#sugg .sg-img{width:34px;aspect-ratio:3/4;flex:none;border-radius:3px;overflow:hidden}
#sugg small{display:block;color:var(--mt);font-size:12px}
#sugg .sg-empty{padding:16px 10px;color:var(--mt);font-size:14px}
.sel{height:38px;background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);color:var(--fg);font:inherit;font-size:13px;font-weight:600;padding:0 8px;cursor:pointer}
.sel:focus{outline:0;border-color:var(--bl)}
.ib{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r);border:1px solid var(--ln);background:var(--pn);transition:border-color .2s}
.ib:hover{border-color:var(--ln2)}
.ib .bd{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--bl);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.only-m{display:none!important}
#drawer{position:fixed;inset:0;z-index:80;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;overflow:auto}
#drawer[hidden]{display:none}
#drawer .dr-top{display:flex;justify-content:space-between;align-items:center;height:50px;margin-bottom:10px}
#drawer a.dl{font-family:var(--fd);font-size:28px;font-weight:700;padding:10px 0;border-bottom:1px solid var(--ln)}
#drawer .dr-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:var(--r);background:var(--bl);color:#fff;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;transition:background .2s,transform .15s,border-color .2s;border:1px solid transparent;white-space:nowrap}
.btn:hover{background:#4169ff}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border-color:var(--ln2);color:var(--fg)}
.btn.ghost:hover{border-color:var(--fg);background:rgba(255,255,255,.04)}
.btn.sm{height:34px;padding:0 14px;font-size:12px}
.btn.lg{height:54px;padding:0 30px;font-size:14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.dng{background:transparent;border-color:rgba(255,91,107,.4);color:var(--er)}
.link{color:var(--bl2);font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}

/* sections */
.sec{padding:44px 0 8px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
.sec-h h2{font-size:clamp(1.35rem,2.4vw,1.8rem)}
.sec-h p{color:var(--mt);font-size:14px;margin-top:6px}
.eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bl2)}

/* art */
.art{position:absolute;inset:0;overflow:hidden;container-type:inline-size;background:linear-gradient(165deg,var(--c1),var(--c2))}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art .art-t{position:absolute;left:8%;right:8%;bottom:7%;font-family:var(--fd);font-weight:800;text-transform:uppercase;font-size:11.5cqw;line-height:.92;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(0,0,0,.55);text-wrap:balance}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.5))}
.ph{position:relative;overflow:hidden;background:#000}
.ph img.up{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* Corrige o dimensionamento dos títulos dentro das capas */
.gc-art .art-t{font-size:clamp(15px,11.5cqw,34px)}
.hero .art .art-t{font-size:clamp(28px,7cqw,72px)}

/* game cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:22px 18px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(176px,208px);gap:18px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:10px;scrollbar-width:thin;scrollbar-color:var(--ln2) transparent}
.rail>*{scroll-snap-align:start;min-width:0}
.gc{position:relative;min-width:0}
.gc-art{display:block;position:relative;container-type:inline-size;width:100%;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;border:1px solid var(--ln);transition:border-color .25s,transform .25s}
.gc-art .art{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.gc:hover .gc-art{border-color:var(--bl2);transform:translateY(-3px)}
.gc:hover .art{transform:scale(1.045)}
.gc-go{position:absolute;left:0;right:0;bottom:0;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:11px;font-weight:700;letter-spacing:.12em;opacity:0;transform:translateY(8px);transition:.25s;z-index:3;text-align:center}
.gc:hover .gc-go,.gc-art:focus-visible .gc-go{opacity:1;transform:none}
.tag{position:absolute;top:10px;left:10px;z-index:3;font-size:11px;font-weight:800;padding:3px 7px;border-radius:3px;background:var(--bl);letter-spacing:.03em}
.tag.off{background:#2b2f3a;color:var(--mt)}
.fav{position:absolute;top:8px;right:8px;z-index:4;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;transition:.2s}
.fav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.fav:hover{background:rgba(0,0,0,.8)}
.fav.on{color:var(--bl2)}
.fav.on svg{fill:currentColor}
.gc-b{padding:12px 2px 0}
.plats{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.pb{font-family:var(--fm);font-size:10px;letter-spacing:.08em;color:var(--mt);border:1px solid var(--ln);border-radius:3px;padding:1px 5px;text-transform:uppercase}
.gc-b h3{font-size:16px;font-family:var(--fb);font-weight:700;letter-spacing:0;line-height:1.25;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gc-p{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.price{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.gc-p s{color:var(--mt);font-size:12px;margin-left:4px;font-variant-numeric:tabular-nums}
.store{font-size:11px;color:var(--mt);text-align:right}

/* hero */
.hero{position:relative;container-type:inline-size;min-height:560px;display:flex;align-items:flex-end;border-bottom:1px solid var(--ln);overflow:hidden;background:#000}
.hero .art{transform:scale(1.15)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,7,10,.94) 0%,rgba(6,7,10,.6) 45%,rgba(6,7,10,.12) 100%),linear-gradient(0deg,var(--bg) 0%,transparent 40%)}
.hero-in{position:relative;z-index:2;width:100%;padding-top:80px;padding-bottom:48px;display:flex;justify-content:space-between;align-items:flex-end;gap:32px}
.hero-tx{max-width:620px}
.hero h1{font-size:clamp(2.6rem,6.5vw,5.2rem);margin:14px 0 16px;letter-spacing:-.03em}
.hero p.d{color:#c4cad9;font-size:17px;max-width:520px}
.hero .meta{display:flex;gap:14px;align-items:center;margin-top:20px;flex-wrap:wrap}
.hero .btns{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.hero-th{display:flex;gap:10px}
.hero-th button{width:78px;aspect-ratio:3/4;position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--ln2);opacity:.65;transition:.25s}
.hero-th button:hover{opacity:1}
.hero-th button.on{opacity:1;border-color:var(--bl2);box-shadow:0 0 0 1px var(--bl2)}
.hero-live{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.hero-live i{width:7px;height:7px;background:var(--bl);border-radius:50%}
.disc{display:inline-block;background:var(--bl);padding:3px 8px;font-weight:800;font-size:13px;border-radius:3px}

/* ranking */
.rank{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:0 36px}
.rk{display:flex;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln);transition:padding .2s}
.rk:hover{padding-left:8px}
.rk .n{font-family:var(--fd);font-weight:800;font-size:32px;width:44px;color:var(--ln2);-webkit-text-stroke:1px var(--mt);color:transparent;text-align:right;flex:none}
.rk .im{width:46px;aspect-ratio:3/4;flex:none;border-radius:4px;position:relative;overflow:hidden}
.rk .tx{min-width:0;flex:1}
.rk .tx b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .tx small{color:var(--mt);font-size:12px}
.rk .pr{font-weight:800;font-variant-numeric:tabular-nums}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tile{position:relative;border:1px solid var(--ln);border-radius:var(--r);padding:22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;background:var(--pn);overflow:hidden;transition:border-color .25s,background .25s}
.tile:hover{border-color:var(--bl2);background:var(--pn2)}
.tile h3{font-size:24px}
.tile small{color:var(--mt)}
.tile svg.bg{position:absolute;right:-20px;top:-20px;width:130px;height:130px;opacity:.08}
.tile .arr{color:var(--bl2);font-weight:700;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;gap:8px;align-items:center;padding:9px 16px;border:1px solid var(--ln);border-radius:100px;font-size:14px;font-weight:600;background:var(--pn);transition:.2s;cursor:pointer}
.chip:hover{border-color:var(--bl2)}
.chip.on{background:var(--bl);border-color:var(--bl)}
.chip small{color:var(--mt);font-weight:500}
.chip.on small{color:#cdd8ff}

/* news */
.news-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px}
.nw{display:block}
.nw .ph{aspect-ratio:16/10;border-radius:var(--r);border:1px solid var(--ln);transition:border-color .25s}
.nw:hover .ph{border-color:var(--bl2)}
.nw .ph .art{transition:transform .6s}
.nw:hover .ph .art{transform:scale(1.05)}
.nw .ct{font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bl2);margin:14px 0 6px;display:block}
.nw h3{font-size:19px;line-height:1.2}
.nw p{color:var(--mt);font-size:14px;margin-top:8px}
.nw.big{grid-column:span 2}
.nw.big .ph{aspect-ratio:21/9}
.nw.big h3{font-size:28px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tg{font-size:12px;color:var(--mt);border:1px solid var(--ln);border-radius:3px;padding:2px 8px;cursor:pointer}
.tg:hover,.tg.on{border-color:var(--bl2);color:var(--fg)}

/* page head */
.ph-h{padding:52px 0 28px;border-bottom:1px solid var(--ln)}
.ph-h h1{font-size:clamp(2rem,4.5vw,3.4rem);margin-top:10px}
.ph-h p{color:var(--mt);max-width:640px;margin-top:12px;font-size:16px}

/* catalog */
.cat{display:grid;grid-template-columns:260px 1fr;gap:36px;padding:32px 0 60px;align-items:start}
.flt{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:22px;padding:18px;border:1px solid var(--ln);border-radius:var(--r);background:rgba(16,19,26,.72)}
.fl label,.fl .lb{display:block;font-family:var(--fm);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mt);margin-bottom:8px}
.in,.ta,.fl select,.fl input[type=text]{width:100%;height:42px;background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);color:var(--fg);padding:0 12px;font:inherit;font-size:14px}
.ta{height:auto;padding:10px 12px;resize:vertical;min-height:90px;line-height:1.5}
.in:focus,.ta:focus,.fl select:focus{outline:0;border-color:var(--bl)}
input[type=range]{width:100%;accent-color:var(--bl)}
.cat-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.cat-top .n{color:var(--mt);font-size:14px}
.empty{border:1px dashed var(--ln2);border-radius:var(--r);padding:56px 24px;text-align:center;color:var(--mt)}
.empty h3{color:var(--fg);margin-bottom:8px;font-size:20px}
.more{display:flex;justify-content:center;margin-top:36px}
.flt-t{display:none}

/* game page */
.gp-top{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;padding:36px 0}
.gp-main{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;border:1px solid var(--ln)}
.gp-th{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.gp-th button{position:relative;aspect-ratio:16/10;border-radius:4px;overflow:hidden;border:1px solid var(--ln);opacity:.6}
.gp-th button.on,.gp-th button:hover{opacity:1;border-color:var(--bl2)}
.play{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:rgba(0,0,0,.25);transition:background .2s}
.play:hover{background:rgba(0,0,0,.1)}
.play span{width:72px;height:72px;border-radius:50%;background:rgba(6,7,10,.7);border:1px solid var(--ln2);display:grid;place-items:center;backdrop-filter:blur(6px)}
.tr-bar{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:12px 16px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:12px;display:flex;gap:12px;align-items:center}
.tr-bar .pg{flex:1;height:3px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}
.tr-bar .pg i{display:block;height:100%;width:0;background:var(--bl2)}
.gp-info h1{font-size:clamp(2rem,3.8vw,3rem);margin:10px 0 14px}
.buybox{border:1px solid var(--ln2);border-radius:var(--r);padding:22px;margin-top:22px;background:var(--pn)}
.buybox .pr{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.buybox .pr b{font-family:var(--fd);font-size:38px;font-variant-numeric:tabular-nums}
.buybox .pr s{color:var(--mt)}
.buybox .btn{width:100%;margin-top:16px}
.buybox .fine{font-size:12px;color:var(--mt);margin-top:12px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:10px 16px;font-size:14px;margin-top:20px}
.kv dt{color:var(--mt)}
.kv dd{margin:0}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.box{border:1px solid var(--ln);border-radius:var(--r);padding:22px;background:var(--pn)}
.box h3{font-size:17px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mt);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--ln2);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--ln);vertical-align:middle}
tr.best td{background:var(--bl3)}
.tw{overflow-x:auto}
.best-b{font-size:10px;font-weight:800;letter-spacing:.08em;background:var(--bl);padding:2px 6px;border-radius:3px;margin-left:8px;white-space:nowrap}
.sp{width:28px;height:28px;border-radius:5px;display:inline-grid;place-items:center;font-weight:800;font-size:12px;vertical-align:middle;margin-right:10px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.03em;white-space:nowrap}
.pill.ok{background:rgba(51,209,154,.14);color:var(--ok)}
.pill.wr{background:rgba(241,180,63,.14);color:var(--wr)}
.pill.er{background:rgba(255,91,107,.14);color:var(--er)}
.pill.bl{background:var(--bl3);color:var(--bl2)}
.pill.mu{background:var(--pn2);color:var(--mt)}

/* article */
.art-body{max-width:720px;margin:0 auto;padding:40px 0 70px;font-size:17px;line-height:1.75}
.art-body p{margin-bottom:22px;color:#d5dae6}

{id:'regiao-de-ativacao',title:'Região de ativação: o que é e por que olhar antes de comprar',cat:'Guias',tags:['chaves','região','dicas'],date:'2026-11-17',read:5,motif:'grid',c:['#06101f','#0f2f66','#6c8fff'],ex:'Uma chave pode funcionar só em certos países. Veja como conferir e evitar a frustração.',body:['Quando você compra uma chave digital, a loja define em quais regiões ela pode ser ativada. Uma chave marcada como Global costuma funcionar em qualquer país; outras ficam restritas a regiões como América Latina ou Europa.','Antes de clicar em comprar, confira o campo de região na página do jogo e na loja parceira. A KeyVault mostra essa informação ao lado de cada oferta para que a comparação seja justa.','Se você viaja ou mora fora do país da conta, vale checar também a região da conta na plataforma. Em caso de dúvida, a política de reembolso da loja é o melhor lugar para confirmar.']},

function partner(id){return S.partners.find(p=>p.id===id)||REMOTE_STORES.find(p=>p.id===id)||S.partners[0]}
const platBadges=g=>g.plat.map(p=>`<span class="pb">${DATA.platShort[p]||p}</span>`).join('');
function offersFor(g){
 if(g.offers)return g.offers.map(o=>({...o,store:partner(o.pid)}));
 const r=mulberry(hsh(g.slug+'o'));const ps=DATA.partners.map(p=>p.id);
 for(let i=ps.length-1;i>0;i--){const j=(r()*(i+1))|0;[ps[i],ps[j]]=[ps[j],ps[i]]}
 const cfg=[['Global',.9],['Brasil',1],['América Latina',.95],[r()>.5?'Europa':'EUA',1.05]];
 return cfg.map((c,i)=>{const mult=c[1]*(.97+r()*.07);const old=g.disc?g.price*mult:null;const price=Math.round(g.price*(1-g.disc/100)*mult*100)/100;return{pid:ps[i],region:c[0],price,old:old?Math.round(old*100)/100:null,disc:g.disc,store:partner(ps[i])}});}
function bestOffer(g,region){let os=offersFor(g);if(region){const f=os.filter(o=>o.region===region||o.region==='Global');if(f.length)os=f}return os.slice().sort((a,b)=>a.price-b.price)[0]}
const isFav=s=>S.favs.includes(s);
const heart='<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.8 4.5 6.5 4.5c2 0 3.6 1 4.5 2.6.9-1.600 2.500-2.600 4.500-2.600 3.700 0 5.600 3.900 4.100 7.300C19.500 16.400 12 21 12 21z"/></svg>';
function card(g,region){const b=bestOffer(g,region);
 return `<article class="gc"><a class="gc-art" href="#jogo-${g.slug}" aria-label="${esc(g.name)}">${art(g)}${b.disc?`<span class="tag">-${b.disc}%</span>`:''}${g.status==='unavailable'?'<span class="tag off">Indisponível</span>':''}<span class="gc-go">${t('view')} →</span></a><button class="fav ${isFav(g.slug)?'on':''}" data-act="fav" data-id="${g.slug}" aria-label="Favoritar ${esc(g.name)}">${heart}</button><div class="gc-b"><div class="plats">${platBadges(g)}</div><h3><a href="#jogo-${g.slug}">${esc(g.name)}</a></h3><div class="gc-p"><div><span class="price">${money(b.price)}</span>${b.old?`<s>${money(b.old)}</s>`:''}</div><span class="store">${esc(b.store.name)}<small style="display:block;color:var(--wr)">preço demonstrativo</small></span></div></div></article>`}

/* ---------- utilidades de UI ---------- */
function toast(m){const d=document.createElement('div');d.className='ts';d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>{d.style.transition='opacity .3s';d.style.opacity=0;setTimeout(()=>d.remove(),300)},2600)}
function modal(html,wide){const m=$('#modal');m.innerHTML=`<div class="mdl${wide?' wide':''}" role="dialog" aria-modal="true"><button class="x" data-act="closeModal" aria-label="Fechar">×</button>${html}</div>`;m.hidden=false}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
function rerender(){render()}
function pillStatus(s){return s==='published'?'<span class="pill ok">Publicado</span>':s==='draft'?'<span class="pill wr">Rascunho</span>':'<span class="pill er">Indisponível</span>'}
function copyText(txt){try{navigator.clipboard.writeText(txt).then(()=>toast('Copiado')).catch(()=>toast('Não foi possível copiar'))}catch(e){toast('Não foi possível copiar')}}

/* ---------- busca ---------- */
function searchGames(q,list){q=norm(q).trim();if(!q)return[];const toks=q.split(/\s+/);
 return (list||pubGames()).map(g=>{const n=norm(g.name),p=norm(g.plat.join(' ')+' '+g.plat.map(x=>DATA.platShort[x]).join(' ')),ge=norm(g.genre),d=norm(g.dev+' '+g.pub);let sc=0,ok=true;
  for(const k of toks){let s=0;if(n.startsWith(k))s=100;else if(n.includes(' '+k))s=80;else if(n.includes(k))s=60;else if(p.includes(k))s=30;else if(ge.includes(k))s=30;else if(d.includes(k))s=15;if(!s){ok=false;break}sc+=s}
  return{g,sc:ok?sc+g.pop/10:0}}).filter(x=>x.sc).sort((a,b)=>b.sc-a.sc).map(x=>x.g)}

/* ---------- gráficos ---------- */
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));const n=v/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function barChart(vals,labels,h){h=h||190;const W=640,L=40,B=22,T=8,mx=niceMax(Math.max(...vals,1)),bw=(W-L)/vals.length;let o=`<svg class="ch" viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="Gráfico de barras">`;
 [0,.5,1].forEach(f=>{const y=T+(h-B-T)*(1-f);o+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${L-6}" y="${y+3}" text-anchor="end">${Math.round(mx*f)}</text>`});
 vals.forEach((v,i)=>{const bh=(h-B-T)*v/mx;o+=`<rect x="${(L+i*bw+bw*.18).toFixed(1)}" y="${(h-B-bh).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${bh.toFixed(1)}" fill="${i===vals.length-1?'#6c8fff':'#2c5bff'}" rx="1.500"/>`;if(i%5===0||i===vals.length-1)o+=`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${h-6}" text-anchor="middle">${labels[i]}</text>`});
 return o+'</svg>'}
function lineChart(series,labels,h){h=h||200;const W=640,L=44,B=22,T=8,all=series.flatMap(s=>s.v),mx=niceMax(Math.max(...all,1)),n=labels.length;let o=`<svg class="ch" viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="Gráfico de linhas">`;
 [0,.5,1].forEach(f=>{const y=T+(h-B-T)*(1-f);o+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${L-6}" y="${y+3}" text-anchor="end">${Math.round(mx*f)}</text>`});
 series.forEach(s=>{const pts=s.v.map((v,i)=>`${(L+(W-L-6)*i/(n-1)).toFixed(1)},${(T+(h-B-T)*(1-v/mx)).toFixed(1)}`);o+=`<polygon points="${L},${h-B} ${pts.join(' ')} ${W-6},${h-B}" fill="${s.c}" fill-opacity=".1"/><polyline points="${pts.join(' ')}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`;const lp=pts[n-1].split(',');o+=`<circle cx="${lp[0]}" cy="${lp[1]}" r="3.500" fill="${s.c}"/>`});
 labels.forEach((l,i)=>{if(i%Math.ceil(n/6)===0||i===n-1)o+=`<text x="${(L+(W-L-6)*i/(n-1)).toFixed(1)}" y="${h-6}" text-anchor="middle">${l}</text>`});
 return o+'</svg>'}
function donut(parts){const tot=parts.reduce((a,p)=>a+p.v,0);let off=0,o='<svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="Origem dos acessos">';parts.forEach(p=>{const len=p.v/tot*295.3;o+=`<circle cx="60" cy="60" r="47" fill="none" stroke="${p.c}" stroke-width="16" stroke-dasharray="${len.toFixed(1)} ${(295.3-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 60 60)"/>`;off+=len});return o+`<text x="60" y="64" text-anchor="middle" fill="#fff" style="font:700 16px var(--fd)">${tot.toLocaleString(LOC[S.lang])}</text></svg>`}

const MET=(function(){const r=mulberry(77),days=[],vis=[],views=[],clk=[];const d0=new Date('2026-11-19T12:00:00');
 for(let i=29;i>=0;i--){const d=new Date(d0);d.setDate(d.getDate()-i);days.push(String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'));const base=1400+Math.sin(i/4)*260+(29-i)*22+r()*320;vis.push(Math.round(base));views.push(Math.round(base*3.1+r()*700));clk.push(Math.round(base*.082+r()*40))}

function openBuy(slug,pid,src){
 const g=getGame(slug),os=offersFor(g),o=(pid&&os.find(x=>x.pid===pid))||bestOffer(g);
 if(!g||!o){toast('Oferta indisponível no momento');return}
 S.clicks.unshift({t:Date.now(),game:slug,store:o.pid,src:src||'Site'});S.clicks=S.clicks.slice(0,300);save();
 const url=(o.url||S.affiliate[slug+'|'+o.pid]||(o.store&&o.store.base)||'').trim();
 let parsed;try{parsed=new URL(url)}catch(e){toast('Link da loja ainda não cadastrado');return}
 if(!['https:','http:'].includes(parsed.protocol)){toast('Link da loja inválido');return}
 window.open(parsed.href,'_blank','noopener,noreferrer');
 toast('Abrimos a loja parceira em uma nova aba');
}

 else if(f==='register'){const em=d.email.toLowerCase();if(S.accounts.some(x=>x.email===em)){toast('Esse e-mail já está cadastrado');return}S.accounts.push({name:d.name,email:em,h:hsh(d.pass)});S.user={name:d.name,email:em};save();render();toast('Conta criada neste navegador')}
 else if(f==='recover'){toast('Prévia: enviaríamos o link para '+d.email);PTAB='login';render()}

/* ---------- catálogo conectado à API ---------- */
async function loadRemoteCatalog(){
 try{
  const response=await fetch(`${KV_API_BASE}/api/catalog`,{headers:{'Accept':'application/json'},cache:'no-store'});
  if(!response.ok)throw new Error(`HTTP ${response.status}`);
  const payload=await response.json();
  const rows=Array.isArray(payload.offers)?payload.offers:[];
  const storeMap=new Map();
  const gameMap=new Map();
  for(const row of rows){
   const rawStore=row.kv_stores||{};
   const rawGame=row.kv_games||{};
   if(!rawGame.id||!rawStore.id)continue;
   const store={id:rawStore.id,name:rawStore.name||'Loja parceira',logo:rawStore.logo_url||null,
    color:'#3568ff',base:rawStore.website_url||'',campaign:'Oferta cadastrada'};
   storeMap.set(store.id,store);
   const slug=rawGame.slug||String(rawGame.id);
   if(!gameMap.has(rawGame.id)){
    const platform=rawGame.platform||'PC';
    gameMap.set(rawGame.id,{
     id:rawGame.id,slug,name:rawGame.name||'Jogo',plat:Array.isArray(platform)?platform:[platform],
     genre:rawGame.genre||'Jogos',dev:'',pub:'',date:'',price:Number(row.price)||0,disc:0,pop:50,
     motif:'rings',c:['#08112a','#1d3a9a','#6c8fff'],tier:'mid',
     desc:rawGame.description||'Compare as ofertas disponíveis nas lojas parceiras.',
     status:'published',custom:true,offers:[]
    });
   }
   gameMap.get(rawGame.id).offers.push({
    pid:rawStore.id,region:row.region||'Brasil',price:Number(row.price)||0,
    old:null,disc:0,store,url:row.url||''
   });
  }
  REMOTE_STORES=[...storeMap.values()];
  REMOTE_CATALOG_LOADED=true;
  REMOTE_GAMES=[...gameMap.values()].map(g=>{
   g.offers.sort((a,b)=>a.price-b.price);
   if(g.offers[0])g.price=g.offers[0].price;
   return g;
  });
  bust();
  render();
  console.info(`[KeyVault] Catálogo conectado: ${REMOTE_GAMES.length} jogo(s), ${rows.length} oferta(s).`);
 }catch(error){
  console.error('[KeyVault] Não foi possível atualizar o catálogo remoto:',error);
  toast('Não foi possível atualizar os preços. Exibindo o catálogo disponível.');
 }
}
